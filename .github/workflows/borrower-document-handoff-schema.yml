name: Borrower Document Handoff Schema

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/20260923010000_ensure_borrower_doc_extraction_handoff.sql
      - supabase/migrations/20260923132024_restrict_borrower_doc_extraction_handoff.sql
      - .github/workflows/borrower-document-handoff-schema.yml
      - scripts/check-borrower-handoff-schema.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brokerage-schema-reconciliation
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.BROKERAGE_MIGRATION_DB_URL }}
      VERIFICATION_DATABASE_URL: ${{ secrets.DRIFT_DETECT_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Check exact deployed handoff contract before changing it
        id: deployed
        run: node scripts/check-borrower-handoff-schema.mjs
      - name: Require migration connection and function ownership when a change is needed
        if: steps.deployed.outputs.current != 'true'
        shell: bash
        run: |
          test -n "$MIGRATION_DATABASE_URL"
          if [ "$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "select has_schema_privilege(current_user,'public','CREATE') and coalesce((select pg_has_role(current_user,proowner,'USAGE') from pg_proc where oid=to_regprocedure('public.ensure_borrower_doc_extraction_handoff(uuid,uuid,uuid)')),true)")" != "t" ]; then
            echo "::error::The handoff differs from the reviewed contract, but the migration connection cannot manage this function. Apply the reviewed migrations using an authorized owner connection."
            exit 1
          fi
      - name: Apply reviewed handoff and permissions in one transaction
        if: steps.deployed.outputs.current != 'true'
        run: >-
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction
          -f supabase/migrations/20260923010000_ensure_borrower_doc_extraction_handoff.sql
          -f supabase/migrations/20260923132024_restrict_borrower_doc_extraction_handoff.sql
      - name: Verify exact handoff contract and access boundaries
        run: node scripts/check-borrower-handoff-schema.mjs --require-current
