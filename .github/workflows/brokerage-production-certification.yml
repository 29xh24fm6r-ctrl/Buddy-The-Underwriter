name: Brokerage Production Certification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CERTIFY_PRODUCTION to run synthetic brokerage journeys against production"
        required: true
        type: string
      legacy_synthetic_deal_ids:
        description: "Optional comma-separated IDs from an interrupted prior certification run"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: brokerage-production-certification
  cancel-in-progress: false

jobs:
  certify:
    if: inputs.confirmation == 'CERTIFY_PRODUCTION'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed release identity
        shell: bash
        run: |
          deployed_sha="$(curl --fail --silent --show-error https://app.buddytheunderwriter.com/api/meta/build | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).commitSha||""))')"
          test "$deployed_sha" = "$GITHUB_SHA"
      - name: Verify production schema contract
        env:
          DATABASE_URL: ${{ secrets.DRIFT_DETECT_DB_URL }}
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          idempotency_column_count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_attribute a join pg_class c on c.oid=a.attrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='signing_requests' and a.attname='idempotency_key' and a.attnum > 0 and not a.attisdropped")"
          marketplace_rpc_count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='claim_marketplace_listing'")"
          echo "idempotency_column_count=$idempotency_column_count"
          echo "marketplace_rpc_count=$marketplace_rpc_count"
          test "$idempotency_column_count" = "1"
          test "$marketplace_rpc_count" -ge "1"
      - name: Run borrower production journey
        run: pnpm synth:borrowers
        env:
          BUDDY_BASE_URL: https://app.buddytheunderwriter.com
          LEGACY_SYNTHETIC_DEAL_IDS: ${{ inputs.legacy_synthetic_deal_ids }}
      - name: Run brokerage ledger journey and clean up
        run: pnpm golden:brokerage -- --cleanup
        env:
          BUDDY_BASE_URL: https://app.buddytheunderwriter.com
      - name: Preserve certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brokerage-production-certification-${{ github.sha }}
          path: .ci/synth-borrower-e2e-report.json
          if-no-files-found: warn
          retention-days: 90
