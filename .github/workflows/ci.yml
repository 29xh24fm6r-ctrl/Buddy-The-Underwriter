name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      SMOKE_AUTH_BOOTSTRAP_URL: ${{ secrets.SMOKE_AUTH_BOOTSTRAP_URL }}
      DRIFT_DETECT_DB_URL: ${{ secrets.DRIFT_DETECT_DB_URL }}
      BORROWER_QA_EMAIL: ${{ secrets.BORROWER_QA_EMAIL }}
      BORROWER_TEST_AUTH_ENABLED: ${{ secrets.BORROWER_TEST_AUTH_ENABLED }}
      BORROWER_TEST_OTP: ${{ secrets.BORROWER_TEST_OTP }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install
        timeout-minutes: 6
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        timeout-minutes: 10
        # Build already runs with an 8 GB heap; tsc over this repo is at
        # least as memory-hungry and had no allowance at all, so it was
        # running near Node's default limit. An OOM here presents as a stall
        # rather than a clear error.
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm -s typecheck
      - name: Lint
        timeout-minutes: 10
        run: pnpm -s lint
      - name: Architectural guards
        timeout-minutes: 8
        run: pnpm -s guard:all
      - name: SPEC-13.5 — no legacy deal_memo_overrides writes
        run: bash scripts/check-no-legacy-overrides-writes.sh
      # SPEC-CI-1: the invariants suite (supersession filtering, spread concurrency,
      # observer auto-heal) was defined but invoked by no workflow. Runs after guards,
      # before the broader unit suite — highest safety-signal per second. Must never
      # be continue-on-error.
      - name: Safety invariants (CI-blocking)
        timeout-minutes: 6
        run: pnpm -s test:invariants
      - name: Unit tests (CI-blocking)
        timeout-minutes: 18
        run: pnpm -s test:unit
      # specs/audits/RESEARCH_SYSTEM_FULL_AUDIT.md P1: this harness existed
      # but was invisible to CI entirely — including the one case explicitly
      # marked "Mandatory regression — yacht-charter memo failure must never
      # recur", which was ALSO being silently self-excluded by a placeholder-
      # detection bug (fixed alongside this). Exits 1 on any regression.
      - name: Research golden-set eval (CI-blocking)
        timeout-minutes: 6
        run: pnpm -s golden:research
      - name: Check cockpit polling guardrail
        run: bash scripts/check-cockpit-polling.sh
      - name: Check Never-500 API invariant
        run: bash scripts/check-never-500.sh
      - name: Schema select gate
        timeout-minutes: 5
        run: pnpm -s gate:schema-select
      # Phase 1 keeps confirmed drift report-only while historical reconciliation
      # is pending. Detector/configuration failures still fail CI.
      - name: Schema drift detection (report-only)
        if: env.DRIFT_DETECT_DB_URL != ''
        run: pnpm -s gate:schema-drift -- --report-only
      - name: Upload drift report
        if: always() && env.DRIFT_DETECT_DB_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: .drift_report/
          include-hidden-files: true
          if-no-files-found: error
      # Production compilation is enforced by the dedicated Build Check workflow.
      # Do not repeat it here: this job's 30-minute budget is reserved for the
      # full guard/test suite and Playwright smoke coverage.
      - name: Install Playwright browser
        # ubuntu-latest already carries the browser runtime libraries. Install
        # only Playwright's pinned Chromium binary; --with-deps re-downloads
        # Ubuntu font packages from a slow external mirror on every PR.
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      - name: E2E Smoke (public)
        timeout-minutes: 12
        run: pnpm -s e2e:smoke:public
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          OPENAI_API_KEY: sk-placeholder
          SMOKE_AUTH_BOOTSTRAP_URL: ${{ secrets.SMOKE_AUTH_BOOTSTRAP_URL }}
      - name: E2E Smoke (authed)
        if: env.SMOKE_AUTH_BOOTSTRAP_URL != ''
        timeout-minutes: 12
        run: pnpm -s e2e:smoke:authed
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          OPENAI_API_KEY: sk-placeholder
          SMOKE_AUTH_BOOTSTRAP_URL: ${{ secrets.SMOKE_AUTH_BOOTSTRAP_URL }}
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Upload build diagnostics (.ci)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: .ci/
          if-no-files-found: warn
